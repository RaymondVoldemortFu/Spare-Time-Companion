[project]
name = "spare-time-companion"
version = "0.1.0"
description = "Cloud voice companion demo service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16.2",
  "dashscope>=1.25.22",
  "email-validator>=2.2.0",
  "fastapi>=0.115.13",
  "httpx>=0.28.1",
  "openai>=1.88.0",
  "pydantic-settings>=2.10.0",
  "python-dotenv>=1.1.0",
  "python-jose[cryptography]>=3.5.0",
  "python-multipart>=0.0.20",
  "sqlmodel>=0.0.24",
  "uvicorn[standard]>=0.34.3",
]

[dependency-groups]
dev = [
  "pytest>=8.4.1",
  "pytest-asyncio>=1.0.0",
  "ruff>=0.12.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/app/tests"]
pythonpath = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py312"
